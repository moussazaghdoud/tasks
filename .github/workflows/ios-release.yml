name: iOS release

# Builds a signed .ipa on a macOS runner and uploads it to TestFlight.
# Nothing here needs a Mac of your own: run it from the Actions tab, or push a
# tag like v1.0.1.

on:
  workflow_dispatch:
    inputs:
      lane:
        description: What to run
        type: choice
        default: beta
        options:
          - beta # build, sign, upload to TestFlight
          - bootstrap # one-off: register the App ID and create the app record
          - check_auth # quick: is the App Store Connect key set up correctly?
      changelog:
        description: What testers should know about this build
        required: false
        default: ''
      marketing_version:
        description: Version shown on the App Store (defaults to package.json)
        required: false
        default: ''
  push:
    tags: ['v*']

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  testflight:
    name: Build, sign, upload to TestFlight
    runs-on: macos-latest
    # A healthy release takes about six minutes. Thirty is five times that —
    # generous for a slow day at Apple, but a hung upload no longer holds the
    # runner, and your attention, for a full hour.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check the required secrets are present
        env:
          LANE: ${{ inputs.lane || 'beta' }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: |
          # check_auth only proves the key works: no team, no certificates needed.
          required="ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8"
          if [ "$LANE" != "check_auth" ]; then required="$required APPLE_TEAM_ID"; fi
          if [ "$LANE" = "beta" ]; then required="$required MATCH_GIT_URL MATCH_PASSWORD"; fi

          # Report every secret, present or not, in the run summary — so a
          # missing one is obvious without digging through the log.
          echo "### Secrets for the \`$LANE\` lane" >> "$GITHUB_STEP_SUMMARY"
          missing=""
          for name in $required; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
              echo "- ❌ \`$name\` — not found" >> "$GITHUB_STEP_SUMMARY"
              echo "MISSING  $name"
            else
              echo "- ✅ \`$name\`" >> "$GITHUB_STEP_SUMMARY"
              echo "present  $name"
            fi
          done

          if [ -n "$missing" ]; then
            {
              echo ""
              echo "Add them under **Settings → Secrets and variables → Actions → Secrets** (the *Secrets* tab, not *Variables*), as **repository** secrets. Names are case-sensitive."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Missing repository secrets:$missing — see docs/ios-release.md"
            exit 1
          fi
          echo "All secrets present for the '$LANE' lane."

      # check_auth only talks to Apple, so it skips the app build entirely.
      - uses: actions/setup-node@v4
        if: inputs.lane != 'check_auth'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: inputs.lane != 'check_auth'

      - name: Build the web app
        if: inputs.lane != 'check_auth'
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
          # Not secrets: a public client embeds its identifiers in the app.
          VITE_M365_CLIENT_ID: ${{ vars.M365_CLIENT_ID }}
          VITE_M365_TENANT_ID: ${{ vars.M365_TENANT_ID }}

      - name: Copy the web app into the native project
        if: inputs.lane != 'check_auth'
        run: npx cap sync ios

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Run fastlane
        run: bundle exec fastlane ios "${LANE}"
        env:
          CI: true
          LANE: ${{ inputs.lane || 'beta' }}
          # App Store names are unique across all apps. If "Hence" is taken,
          # set an APP_NAME repository variable instead of editing this file.
          APP_NAME: ${{ vars.APP_NAME || 'Hence' }}
          APP_IDENTIFIER: ${{ vars.APP_IDENTIFIER || 'com.moussazaghdoud.hence' }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          # A unique, increasing build number: the run number never repeats.
          BUILD_NUMBER: ${{ github.run_number }}
          MARKETING_VERSION: ${{ inputs.marketing_version }}
          CHANGELOG: ${{ inputs.changelog }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 120
          FASTLANE_HIDE_CHANGELOG: true

      - name: Keep the build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: |
            build/*.ipa
            build/*.dSYM.zip
            fastlane/report.xml
          retention-days: 14
          if-no-files-found: ignore
