name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Types, tests, web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
          VITE_M365_CLIENT_ID: ${{ vars.M365_CLIENT_ID }}
          VITE_M365_TENANT_ID: ${{ vars.M365_TENANT_ID }}

  fastlane:
    name: Release config is valid
    # Catches a typo in the Fastfile in 40 seconds instead of halfway through a
    # release build. Needs no secrets: it only parses the configuration.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Parse the Fastfile and list the lanes
        run: bundle exec fastlane lanes
        env:
          FASTLANE_SKIP_UPDATE_CHECK: true
          FASTLANE_OPT_OUT_USAGE: true

  ios:
    name: iOS compiles (unsigned)
    # The native project only breaks when these change, and macOS minutes are
    # the expensive kind.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ios]') || github.event_name == 'pull_request'
    needs: web
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the web app
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
          VITE_M365_CLIENT_ID: ${{ vars.M365_CLIENT_ID }}
          VITE_M365_TENANT_ID: ${{ vars.M365_TENANT_ID }}
      - name: Copy the web app into the native project
        run: npx cap sync ios
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Compile (no signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO | tail -40
