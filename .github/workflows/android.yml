name: Android

# Builds an installable test .apk on every push to the android branch. Nothing
# is signed for the Play Store yet: download the apk from the run's page and
# open it on an Android phone.

on:
  push:
    branches: [android]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build the test apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run typecheck
      - name: Build the web app
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
          VITE_M365_CLIENT_ID: ${{ vars.M365_CLIENT_ID }}
          VITE_M365_TENANT_ID: ${{ vars.M365_TENANT_ID }}
          VITE_M365_WORK_CLIENT_ID: ${{ vars.M365_WORK_CLIENT_ID }}
          VITE_M365_WORK_TENANT_ID: ${{ vars.M365_WORK_TENANT_ID }}
          VITE_M365_WORK_DOMAIN: ${{ vars.M365_WORK_DOMAIN }}
          # Google, one identifier: an installed app takes no secret.
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      - name: Copy the web app into the native project
        run: npx cap sync android
      # One debug key for every build, so each test apk installs over the last
      # one and keeps the thoughts; a fresh runner would otherwise make a new key.
      - name: Keep the same debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: hence-debug-keystore
      # Gradle itself, kept apart from the dependency cache: that one is keyed on
      # the build files and starts over at every change, and the download of
      # Gradle from its servers sometimes fails (timeouts, 504).
      - name: Keep Gradle itself
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-wrapper-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Fetch Gradle (with retries)
        working-directory: android
        run: |
          chmod +x gradlew
          for i in 1 2 3; do ./gradlew --version --no-daemon > /dev/null && break; echo "Gradle download failed, retry $i"; sleep 20; done
      - name: Compile
        working-directory: android
        run: |
          chmod +x gradlew
          # On failure, the reasons become annotations, readable without opening the log.
          if ! ./gradlew assembleDebug --no-daemon > build.log 2>&1; then
            { grep -E "error:|What went wrong|Duplicate class|^e: |Could not|Exception|> " build.log || true; } | head -25 | while IFS= read -r line; do echo "::error::$line"; done
            tail -60 build.log
            exit 1
          fi
          # Named after the build, so the phone never opens an older file by mistake.
          mv app/build/outputs/apk/debug/app-debug.apk "hence-${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: hence-android-${{ github.run_number }}
          path: android/hence-${{ github.run_number }}.apk
          retention-days: 30
